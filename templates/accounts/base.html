{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Akun{% endblock %} — TAKARKUY</title>
  {% include "partials/head.html" %}
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    .auth-card { width: min(100%, 480px); padding: 36px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); border-top: 4px solid var(--green); }
    .auth-card.login { max-width: 430px; }
    .auth-card a:not(.btn) { color: var(--green-dark); font-weight: 700; }
    .auth-card a:not(.btn):hover { text-decoration: underline; }
    .back-home { display: inline-flex; align-items: center; min-height: 44px; margin: -12px 0 8px; font-size: 14px; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--ink) !important; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
    .brand:hover { text-decoration: none !important; }
    .brand img { width: 56px; height: 66px; }
    .auth-card h1 { max-width: 360px; margin: 0 auto 26px; font-size: clamp(24px, 5vw, 28px); line-height: 1.25; letter-spacing: -.02em; text-align: center; }
    .signup h1 span { color: var(--green-mid); }
    .field { margin-bottom: 16px; }
    .field-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
    label { color: var(--ink); font-size: 14px; font-weight: 700; }
    .password-hint { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
    .field-top .password-hint { margin-top: 0; text-align: right; }
    .input-wrap { position: relative; }
    .field input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none; background: var(--surface); font-size: 15px; }
    .field input::placeholder { color: #8a949c; }
    .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .field input[aria-invalid="true"] { border-color: var(--danger); }
    .input-wrap:has(.toggle-password) input { padding-right: 112px; }
    .toggle-password { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--green-dark); font-size: 13px; font-weight: 700; }
    .toggle-password:hover { background: var(--soft); }
    .field-errors, .form-errors { margin: 6px 0 0; padding: 0; color: var(--danger); font-size: 13px; list-style: none; }
    .form-errors { margin-bottom: 16px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--danger-soft); }
    .remember { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; }
    .remember input { width: 18px; height: 18px; accent-color: var(--green); }
    .submit { width: 100%; min-height: 50px; margin-top: 4px; border: 0; border-radius: var(--radius-sm); background: var(--green); color: var(--lime); font-size: 15px; font-weight: 800; }
    .submit:hover { background: var(--green-mid); }
    .submit[aria-busy="true"] { opacity: .8; }
    .switch-page { margin: 22px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
    @media (max-width: 480px) { .auth-card { padding: 28px 20px; } }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block page %}<div class="auth-page">{% block content %}{% endblock %}</div>{% endblock %}
  <script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        button.textContent = visible ? "Sembunyikan" : "Tampilkan";
        button.setAttribute("aria-label", `${visible ? "Sembunyikan" : "Tampilkan"} kata sandi`);
      });
    });
  </script>
</body>
</html>
