{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sedang dalam Pengembangan — TAKARKUY</title>
  <link rel="icon" href="{% static 'takarkuy/logo.svg' %}" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f2f8f4; color: #10251c; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 540px); padding: 44px 32px; border: 1px solid #dcebe2; border-radius: 24px; background: #fff; box-shadow: 0 16px 40px rgb(15 61 46 / 8%); text-align: center; }
    .logo { display: block; margin: 0 auto 24px; }
    h1 { margin: 0 0 16px; font-size: clamp(26px, 6vw, 34px); line-height: 1.2; letter-spacing: -.035em; }
    .description { margin: 0 auto 28px; max-width: 390px; color: #5a6f64; line-height: 1.7; }
    a { display: inline-block; padding: 13px 24px; border-radius: 10px; background: #0f3d2e; color: #d4f45a; font-weight: 700; text-decoration: none; }
    a:hover { background: #15503c; }
    a:focus-visible { outline: 3px solid #2f9e72; outline-offset: 4px; }
    .note { margin: 24px 0 0; color: #5a6f64; font-size: 13px; line-height: 1.6; }
    @media (max-width: 480px) { main { padding: 32px 22px; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="{% static 'takarkuy/logo.svg' %}" alt="TAKARKUY" width="96" height="114">
    <h1>Sedang dalam pengembangan</h1>
    <p class="description">Kami sedang menyiapkan pembaruan TAKARKUY. Untuk sementara, seluruh fitur belum dapat diakses. Silakan kembali lagi nanti.</p>
    <a href="{% url 'landing' %}">Coba lagi</a>
    <p class="note">Terima kasih sudah menunggu, Penakar.</p>
  </main>
</body>
</html>
